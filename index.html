<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSST Owner Draw Slip</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
 :root {
 --rose: #e8a0a0;
 --rose-deep: #c97070;
 --rose-light: #f5dada;
 --rose-pale: #fdf0f0;
 --cream: #fdf8f5;
 --ink: #3a2a2a;
 --ink-soft: #7a5a5a;
 --gold: #c9a84c;
 }
 * { box-sizing: border-box; margin:0; padding:0; }
 body {
 font-family: 'Lato', sans-serif;
 background: var(--cream);
 color: var(--ink);
 padding: 20px;
 }
 .page { max-width: 620px; margin: 0 auto; }

 .toolbar {
 background: white;
 border: 1px solid var(--rose-light);
 border-radius: 16px;
 padding: 16px 20px;
 margin-bottom: 20px;
 display: flex;
 flex-wrap: wrap;
 gap: 10px;
 align-items: center;
 justify-content: space-between;
 }
 .toolbar-label {
 font-size: 0.72rem;
 text-transform: uppercase;
 letter-spacing: 1.5px;
 color: var(--ink-soft);
 font-weight: 700;
 }
 .btn {
 font-family: 'Lato', sans-serif;
 font-size: 0.82rem;
 font-weight: 700;
 padding: 8px 18px;
 border-radius: 20px;
 border: 1.5px solid;
 cursor: pointer;
 transition: all 0.2s;
 letter-spacing: 0.5px;
 }
 .btn-rose {
 background: var(--rose-deep);
 border-color: var(--rose-deep);
 color: white;
 }
 .btn-rose:hover { background: #b85f5f; }
 .btn-outline {
 background: white;
 border-color: var(--rose-light);
 color: var(--rose-deep);
 }
 .btn-outline:hover { background: var(--rose-pale); }

 .card {
 background: white;
 border-radius: 20px;
 border: 2px solid var(--rose-light);
 overflow: hidden;
 }
 .card::before {
 content:'';
 display:block;
 height:6px;
 background: linear-gradient(90deg, var(--rose-light), var(--rose-deep), var(--rose-light));
 }
 .inner { padding: 32px 36px; }
 .header { text-align:center; margin-bottom: 20px; }
 .header h1 {
 font-family: 'Playfair Display', serif;
 color: var(--rose-deep);
 font-size: 1.6rem;
 margin-bottom: 4px;
 }
 .header .sub {
 font-size: 0.78rem;
 color: var(--ink-soft);
 letter-spacing: 1px;
 }
 .banner {
 text-align:center;
 background: var(--rose-pale);
 border: 1px solid var(--rose-light);
 border-radius: 10px;
 padding: 8px;
 margin: 18px 0 24px;
 font-family:'Playfair Display', serif;
 color: var(--rose-deep);
 letter-spacing: 2px;
 text-transform: uppercase;
 font-size: 0.95rem;
 }
 .field-row {
 display:flex;
 gap: 20px;
 margin-bottom: 22px;
 flex-wrap: wrap;
 }
 .field { flex: 1; min-width: 200px; }
 .field label {
 display:block;
 font-size: 0.68rem;
 text-transform: uppercase;
 letter-spacing: 1.5px;
 color: var(--ink-soft);
 font-weight: 700;
 margin-bottom: 6px;
 }
 .field input {
 width: 100%;
 font-family: 'Lato', sans-serif;
 font-size: 0.95rem;
 font-weight: 700;
 color: var(--ink);
 border: none;
 border-bottom: 1.5px dashed var(--rose-light);
 background: transparent;
 outline: none;
 padding: 4px 2px;
 }
 .field input:focus { border-bottom-color: var(--rose-deep); }

 .amount-box {
 background: var(--rose-pale);
 border: 1.5px solid var(--rose-deep);
 border-radius: 10px;
 padding: 14px 18px;
 margin-bottom: 24px;
 display:flex;
 align-items:center;
 justify-content: space-between;
 gap: 16px;
 }
 .amount-box .lbl {
 font-family:'Playfair Display', serif;
 color: var(--rose-deep);
 font-size: 1rem;
 letter-spacing: 1px;
 white-space: nowrap;
 }
 .amount-box input {
 flex: 1;
 text-align: right;
 font-family: 'Lato', sans-serif;
 font-size: 1.1rem;
 font-weight: 700;
 color: var(--ink);
 border: none;
 border-bottom: 1.5px dashed var(--rose-deep);
 background: transparent;
 outline: none;
 padding: 4px 2px;
 }

 .note-area label {
 display:block;
 font-size: 0.68rem;
 text-transform: uppercase;
 letter-spacing: 1.5px;
 color: var(--ink-soft);
 font-weight: 700;
 margin-bottom: 6px;
 }
 .note-area textarea {
 width: 100%;
 min-height: 64px;
 font-family: 'Lato', sans-serif;
 font-size: 0.88rem;
 color: var(--ink);
 border: 1.5px dashed var(--rose-light);
 border-radius: 8px;
 background: transparent;
 outline: none;
 padding: 8px 10px;
 resize: vertical;
 }
 .note-area textarea:focus { border-color: var(--rose-deep); }

 .sig-row {
 display:flex;
 gap: 30px;
 margin-top: 30px;
 }
 .sig { flex:1; }
 .sig input {
 width: 100%;
 font-family: 'Lato', sans-serif;
 font-size: 0.9rem;
 color: var(--ink);
 border: none;
 border-bottom: 1.5px dashed var(--rose-light);
 background: transparent;
 outline: none;
 padding: 4px 2px;
 margin-bottom: 6px;
 min-height: 26px;
 }
 .sig .cap {
 font-size: 0.7rem;
 color: var(--ink-soft);
 text-transform: uppercase;
 letter-spacing: 1px;
 }

 .footer {
 text-align:center;
 margin-top: 28px;
 font-size: 0.72rem;
 color: var(--rose-deep);
 letter-spacing: 0.5px;
 }
 .staple-note {
 text-align:center;
 font-size: 0.7rem;
 color: var(--ink-soft);
 font-style: italic;
 margin-top: 6px;
 }

 @media print {
 body { background: white; padding: 0; }
 .toolbar { display: none !important; }
 .card { border-radius: 0; }
 input, textarea { border: none !important; }
 }

 @media (max-width: 520px) {
 .inner { padding: 20px 16px; }
 .toolbar { flex-direction: column; align-items: flex-start; }
 }
</style>
</head>
<body>
<div class="page">

 <div class="toolbar">
 <div class="toolbar-label">BSST Owner Draw Slip</div>
 <div style="display:flex; gap:10px;">
 <button class="btn btn-outline" onclick="clearSlip()">Start New</button>
 <button class="btn btn-rose" onclick="window.print()">Print</button>
 </div>
 </div>

 <div class="card">
 <div class="inner">
 <div class="header">
 <h1>Beads, Seams &amp; Sticky Things</h1>
 <div class="sub">LAHAINA, MAUI &nbsp;&middot;&nbsp; 808-250-3918</div>
 </div>

 <div class="banner">Owner Draw Record</div>

 <div class="field-row">
 <div class="field">
 <label>Date</label>
 <input type="text" id="drawDate" placeholder="e.g. August 1, 2026">
 </div>
 <div class="field">
 <label>Draw #</label>
 <input type="text" id="drawNum" placeholder="e.g. 001">
 </div>
 </div>

 <div class="amount-box">
 <span class="lbl">Amount Withdrawn</span>
 <input type="text" id="drawAmount" placeholder="$0.00">
 </div>

 <div class="note-area">
 <label>Reason / Note</label>
 <textarea id="drawNote" placeholder="e.g. Personal transfer"></textarea>
 </div>

 <div class="sig-row">
 <div class="sig">
 <input type="text" id="drawSig">
 <div class="cap">Signature</div>
 </div>
 <div class="sig">
 <input type="text" id="drawBalance">
 <div class="cap">Account Balance After Draw</div>
 </div>
 </div>

 <div class="footer">
 Owner's Draw - Not a Business Expense - Personal Transfer of Profit
 </div>
 <div class="staple-note">Staple bank withdrawal slip here</div>
 </div>
 </div>
</div>

<script>
 function clearSlip() {
 if (!confirm('Clear this slip and start fresh?')) return;
 document.getElementById('drawDate').value = '';
 document.getElementById('drawNum').value = '';
 document.getElementById('drawAmount').value = '';
 document.getElementById('drawNote').value = '';
 document.getElementById('drawSig').value = '';
 document.getElementById('drawBalance').value = '';
 setToday();
 }

 function setToday() {
 const today = new Date();
 const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
 document.getElementById('drawDate').value = months[today.getMonth()] + ' ' + today.getDate() + ', ' + today.getFullYear();
 }

 setToday();
</script>
</body>
</html>
